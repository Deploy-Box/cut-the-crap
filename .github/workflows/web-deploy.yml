name: Deploy website and Functions API

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'backend/**'
      - 'terraform/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cut-the-crap-web-deploy
  cancel-in-progress: false

jobs:
  backend-quality:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      FUNCTIONS_WORKER_RUNTIME: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt pytest==9.2.0 pytest-asyncio==1.5.0
      - run: python -m pytest

  quality:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify static build
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_API_BASE: https://cutthecrap.deploy-box.com
          NEXT_PUBLIC_STRIPE_PRICE_MONTHLY: price_BUILDVALIDATION
          NEXT_PUBLIC_STRIPE_PRICE_YEARLY: price_BUILDVALIDATION
        run: npm run build
      - name: Verify target subscription
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ "$AZURE_SUBSCRIPTION_ID" != "3d5d1ab2-b17f-4c99-9bf1-db4fe0ad882e" ]; then
            echo "AZURE_SUBSCRIPTION_ID must match the target production subscription." >&2
            exit 1
          fi

  infrastructure:
    needs: [quality, backend-quality]
    uses: Deploy-Box/deploy-box-platform/.github/workflows/terraform-deploy.yml@b360734ba2c250c06b3a81e29f6a865fab248d24
    with:
      terraform_dir: ./terraform
      terraform_version: "1.16.x"
      use_plan_file: true
      environment: main
    secrets: inherit

  deploy-api:
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-cutthecrap-api-prod
          package: backend
          respect-funcignore: true
          remote-build: true
      - name: Verify API readiness and preview isolation
        run: |
          host="$(az functionapp show --resource-group rg-cutthecrap-prod \
            --name func-cutthecrap-api-prod --query defaultHostName -o tsv)"
          if [ -z "$host" ]; then
            echo "Function App did not return a hostname." >&2
            exit 1
          fi
          for attempt in $(seq 1 36); do
            if curl --silent --show-error --fail --max-time 20 "https://$host/api/health" > /dev/null; then
              status="$(curl --silent --show-error --max-time 20 --output /dev/null \
                --write-out '%{http_code}' "https://$host/api/v1/recipes")"
              if [ "$status" = "503" ]; then
                echo "Function App is healthy and preview access is restricted."
                exit 0
              fi
              echo "Preview access is not restricted (HTTP $status)." >&2
              exit 1
            fi
            echo "Waiting for Function App readiness ($attempt/36)..."
            sleep 10
          done
          echo "Function App did not become healthy." >&2
          exit 1

  build:
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Load public Stripe price IDs
        env:
          APP_KEY_VAULT: ${{ vars.CTC_APP_KEY_VAULT_READY == 'true' && 'kv-cutthecrap-prod' || 'kv-kalebwbishop-apps' }}
        run: |
          for plan in monthly yearly; do
            value="$(az keyvault secret show --vault-name "$APP_KEY_VAULT" \
              --name "ctc-prod-stripe-price-pro-$plan" --query value -o tsv)"
            if [[ ! "$value" =~ ^price_[[:alnum:]]+$ ]]; then
              echo "Missing or invalid Stripe $plan price ID in $APP_KEY_VAULT." >&2
              exit 1
            fi
            echo "NEXT_PUBLIC_STRIPE_PRICE_${plan^^}=$value" >> "$GITHUB_ENV"
          done
      - name: Build static website
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_API_BASE: https://cutthecrap.deploy-box.com
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-website
          path: web/out
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-website
          path: web/out
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Get Static Web App deployment token
        id: token
        run: |
          token="$(az staticwebapp secrets list \
            --name swa-cutthecrap-web-prod \
            --resource-group rg-cutthecrap-prod \
            --query properties.apiKey --output tsv)"
          if [ -z "$token" ]; then
            echo "Azure Static Web Apps returned an empty deployment token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "api_token=$token" >> "$GITHUB_OUTPUT"
      - name: Deploy static website
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.api_token }}
          action: upload
          app_location: web/out
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
