name: Deploy static website

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'terraform/**'
      - '.github/workflows/web-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cut-the-crap-web-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: main
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build static website
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_API_BASE: https://cutthecrap.deploy-box.com
          NEXT_PUBLIC_STRIPE_PRICE_MONTHLY: ${{ vars.NEXT_PUBLIC_STRIPE_PRICE_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_YEARLY: ${{ vars.NEXT_PUBLIC_STRIPE_PRICE_YEARLY }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_STRIPE_PRICE_MONTHLY" ] || [ -z "$NEXT_PUBLIC_STRIPE_PRICE_YEARLY" ]; then
            echo "Configure both NEXT_PUBLIC_STRIPE_PRICE_MONTHLY and NEXT_PUBLIC_STRIPE_PRICE_YEARLY in the main environment." >&2
            exit 1
          fi
          if [ "$AZURE_SUBSCRIPTION_ID" != "3d5d1ab2-b17f-4c99-9bf1-db4fe0ad882e" ]; then
            echo "AZURE_SUBSCRIPTION_ID must match the target production subscription." >&2
            exit 1
          fi
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-website
          path: web/out
          if-no-files-found: error
          retention-days: 1

  infrastructure:
    needs: build
    uses: Deploy-Box/deploy-box-platform/.github/workflows/terraform-deploy.yml@b360734ba2c250c06b3a81e29f6a865fab248d24
    with:
      terraform_dir: ./terraform
      terraform_version: "1.16.x"
      use_plan_file: true
      environment: main
    secrets: inherit

  deploy:
    needs: infrastructure
    runs-on: ubuntu-latest
    environment: main
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-website
          path: web/out
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Get Static Web App deployment token
        id: token
        run: |
          token="$(az staticwebapp secrets list \
            --name swa-cutthecrap-web-prod \
            --resource-group rg-cutthecrap-web-prod \
            --query properties.apiKey --output tsv)"
          if [ -z "$token" ]; then
            echo "Azure Static Web Apps returned an empty deployment token." >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "api_token=$token" >> "$GITHUB_OUTPUT"
      - name: Deploy static website
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.api_token }}
          action: upload
          app_location: web/out
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
